# Shared by water and pen. These controllers execute inside the Gazebo process.
/so101/controller_manager:
  ros__parameters:
    update_rate: 1000
    enforce_command_limits: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/so101/joint_state_broadcaster:
  ros__parameters:
    update_rate: 200
    joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]
    interfaces: [position, velocity, effort]

/so101/arm_controller:
  ros__parameters:
    joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    interpolation_method: splines
    interpolate_from_desired_state: true
    constraints:
      stopped_velocity_tolerance: 0.05

/so101/gripper_controller:
  ros__parameters:
    joints: [gripper]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    interpolation_method: splines
    interpolate_from_desired_state: true
    gains:
      gripper:
        p: 0.08
        i: 0.0
        d: 0.008
        ff_velocity_scale: 0.0
        u_clamp_min: -0.01
        u_clamp_max: 0.01
    constraints:
      stopped_velocity_tolerance: 0.05
